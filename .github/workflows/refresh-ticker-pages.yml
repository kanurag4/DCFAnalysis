name: Refresh ticker pages

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-ticker-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~14s/ticker since 48c4c4b7a added 3200ms spacing between buildTickerPage's
    # 4-6 internal Worker fetches (the 429 fix); the full ~275-ticker batch now
    # runs ~75 min, well past the old 30-min cap that was cancelling every run.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # Read-only, growth-manifest-only need: generate-market-index.js merges
      # growth-method tickers (a different repo/template) into the same
      # per-market list so kashvector.com/dcf/stocks/<market>/ is the one
      # browsable list, not two -- see that script for why. Without this
      # checkout, the automated refresh has no access to
      # www/growth/stocks/<market>/manifest.json at all and would silently
      # regenerate a DCF-only list, reverting any growth tickers a human
      # published locally via create-growth-ticker-page.
      - name: Checkout stock-evaluator (read-only, for growth ticker manifests)
        uses: actions/checkout@v4
        with:
          repository: kanurag4/stock-evaluator
          ref: main
          token: ${{ secrets.KV_PUBLISH_PAT }}
          path: stock-evaluator-growth

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm test (abort on failure)
        run: npm test

      - name: Run the batch
        env:
          KV_BATCH_KEY: ${{ secrets.KV_BATCH_KEY }}
        run: node scripts/refresh-ticker-pages.js 2>&1 | tee run.log

      - name: Commit snapshot to staging branch
        id: stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B staging/ticker-pages
          git add www/stocks
          git commit -m "data: ticker pages refresh $(date -u +%Y-%m-%d)"
          git push --force origin staging/ticker-pages

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify admin console
        env:
          ADMIN_INGEST_URL: ${{ secrets.ADMIN_INGEST_URL }}
          RUN_INGEST_SECRET: ${{ secrets.RUN_INGEST_SECRET }}
          RUN_LOG_PATH: run.log
        run: node scripts/notify-ticker-refresh.js "${{ steps.stage.outputs.sha }}"
