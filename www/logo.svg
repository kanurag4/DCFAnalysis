<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- circle background -->
  <circle cx="32" cy="32" r="32" fill="#0f172a"/>
  <circle cx="32" cy="32" r="32" fill="#1e293b" opacity="0.6"/>
  <!-- vertical bar + upward arrowhead -->
  <line x1="14" y1="55" x2="14" y2="19" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="14,7 8,19 20,19" fill="#38bdf8"/>
  <!-- upper arm + up-right arrowhead -->
  <line x1="17" y1="32" x2="41" y2="14" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round"/>
  <polygon points="51,8 45.2,18.9 38.8,9.9" fill="#38bdf8"/>
  <!-- lower arm — no arrowhead -->
  <line x1="17" y1="32" x2="51" y2="56" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- junction node -->
  <circle cx="17" cy="32" r="5.5" fill="#38bdf8"/>
  <circle cx="17" cy="32" r="2.5" fill="#0f172a"/>
</svg>
