<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- axes -->
  <path d="M14 8 V52 H56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- year ticks (1, 2, 3) -->
  <path d="M26 52 v3 M38 52 v3 M50 52 v3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- price path: yr1 +10%, yr2 -5%, yr3 +20% -->
  <polyline points="14,40 26,30 38,35 50,14" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points -->
  <circle cx="14" cy="40" r="2" fill="#34d399"/>
  <circle cx="26" cy="30" r="2" fill="#34d399"/>
  <circle cx="38" cy="35" r="2" fill="#34d399"/>
  <circle cx="50" cy="14" r="2.4" fill="#34d399"/>
</svg>
